name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: { contents: read }

# Новый пуш в ту же ветку отменяет устаревший запуск
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Имя джоба не меняем: на него может быть завязана защита ветки main
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      # Заглушка: prisma generate не подключается к БД, но требует переменную
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate

      - name: Typecheck
        run: npm run typecheck
